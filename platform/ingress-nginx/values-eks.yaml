# EKS-specific overlay for ingress-nginx
# Differences from values.yaml (kind):
#   - Deployment instead of DaemonSet (traffic enters via LB, not hostPort)
#   - 2 replicas for HA across 2 AZs
#   - Service type LoadBalancer with NLB annotations
#   - No nodeSelector/tolerations: any worker node is fine
#   - Admission webhooks ENABLED (kind workaround not needed here)
#   - Explicit resource requests for the tight 2-node cluster

controller:
  kind: Deployment
  replicaCount: 2

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  admissionWebhooks:
    enabled: true

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack
