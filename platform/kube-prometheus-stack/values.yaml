# Exclude node-exporter from kind's control-plane node.
# kind control-plane has known issues with hostPort node-exporter;
# this restriction is not needed on real cloud Kubernetes (EKS/AKS/GKE).
prometheus-node-exporter:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist

# Pin observability components to the platform-tier node
prometheus:
  prometheusSpec:
    nodeSelector:
      workload-tier: platform
    retention: 24h
    resources:
      requests:
        memory: 1Gi
        cpu: 100m
      limits:
        memory: 2Gi

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      workload-tier: platform

grafana:
  nodeSelector:
    workload-tier: platform
  # Local dev password only; we change this on EKS
  adminPassword: admin
  service:
    type: ClusterIP

prometheusOperator:
  nodeSelector:
    workload-tier: platform
